apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.agentic.rancher.io
spec:
  group: agentic.rancher.io
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Display Name
          type: string
          jsonPath: .spec.displayName
        - name: Repository
          type: string
          jsonPath: .spec.repository
        - name: Dispatchable
          type: boolean
          jsonPath: .spec.dispatchable
        - name: Runs
          type: integer
          jsonPath: .status.totals.runs
        - name: Last Run
          type: date
          jsonPath: .status.lastRun.startTime
      schema:
        openAPIV3Schema:
          type: object
          description: A gh-aw agentic workflow discovered in an AgentRepository. Written by the controller.
          properties:
            spec:
              type: object
              properties:
                repositoryRef:
                  type: string
                  description: Name of the owning AgentRepository.
                repository:
                  type: string
                  description: GitHub owner/name, copied for display.
                workflowFile:
                  type: string
                  description: Path of the gh-aw markdown source, e.g. .github/workflows/issue-triage.md.
                lockFile:
                  type: string
                  description: Path of the compiled workflow, e.g. .github/workflows/issue-triage.lock.yml.
                workflowId:
                  type: integer
                  format: int64
                displayName:
                  type: string
                description:
                  type: string
                engine:
                  type: string
                model:
                  type: string
                timeoutMinutes:
                  type: integer
                triggers:
                  type: array
                  description: Trigger names from the frontmatter "on" block, e.g. schedule, workflow_dispatch, slash_command, issues.
                  items:
                    type: string
                schedule:
                  type: string
                  description: Cron expression or gh-aw fuzzy schedule such as "daily".
                slashCommand:
                  type: string
                dispatchable:
                  type: boolean
                  description: True when the workflow declares workflow_dispatch, so an AgentRun can start it.
                dispatchInputs:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      type:
                        type: string
                      required:
                        type: boolean
                      default:
                        type: string
                      options:
                        type: array
                        items:
                          type: string
                safeOutputs:
                  type: array
                  description: Safe-output kinds the agent may produce, e.g. create-pull-request, add-comment.
                  items:
                    type: string
                htmlUrl:
                  type: string
            status:
              type: object
              properties:
                state:
                  type: string
                  description: GitHub workflow state, e.g. active or disabled_manually.
                lastRun:
                  type: object
                  properties:
                    name:
                      type: string
                    conclusion:
                      type: string
                    startTime:
                      type: string
                      format: date-time
                    htmlUrl:
                      type: string
                totals:
                  type: object
                  description: Sum of all daily buckets.
                  properties:
                    runs:
                      type: integer
                      format: int64
                    succeeded:
                      type: integer
                      format: int64
                    failed:
                      type: integer
                      format: int64
                    cancelled:
                      type: integer
                      format: int64
                    durationSeconds:
                      type: integer
                      format: int64
                    inputTokens:
                      type: integer
                      format: int64
                    outputTokens:
                      type: integer
                      format: int64
                    cacheReadTokens:
                      type: integer
                      format: int64
                    cacheWriteTokens:
                      type: integer
                      format: int64
                    comments:
                      type: integer
                      format: int64
                    issues:
                      type: integer
                      format: int64
                    pullRequests:
                      type: integer
                      format: int64
                    pullRequestsMerged:
                      type: integer
                      format: int64
                    pullRequestsClosed:
                      type: integer
                      format: int64
                    labels:
                      type: integer
                      format: int64
                    otherOutputs:
                      type: integer
                      format: int64
                    aiCredits:
                      type: number
                daily:
                  type: array
                  description: One bucket per UTC day, oldest first, kept for 90 days.
                  items:
                    type: object
                    required: [date]
                    properties:
                      date:
                        type: string
                        description: UTC day as YYYY-MM-DD.
                      runs:
                        type: integer
                        format: int64
                      succeeded:
                        type: integer
                        format: int64
                      failed:
                        type: integer
                        format: int64
                      cancelled:
                        type: integer
                        format: int64
                      durationSeconds:
                        type: integer
                        format: int64
                      inputTokens:
                        type: integer
                        format: int64
                      outputTokens:
                        type: integer
                        format: int64
                      cacheReadTokens:
                        type: integer
                        format: int64
                      cacheWriteTokens:
                        type: integer
                        format: int64
                      comments:
                        type: integer
                        format: int64
                      issues:
                        type: integer
                        format: int64
                      pullRequests:
                        type: integer
                        format: int64
                      pullRequestsMerged:
                        type: integer
                        format: int64
                      pullRequestsClosed:
                        type: integer
                        format: int64
                      labels:
                        type: integer
                        format: int64
                      otherOutputs:
                        type: integer
                        format: int64
                      aiCredits:
                        type: number
                observedGeneration:
                  type: integer
                  format: int64
