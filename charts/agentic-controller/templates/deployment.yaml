apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentic-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentic-controller.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: agentic-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --leader-elect={{ .Values.leaderElection }}
            - --github-api-url={{ .Values.githubApiUrl }}
            - --max-collections-per-sync={{ .Values.maxCollectionsPerSync }}
            - --zap-log-level={{ .Values.logLevel }}
            {{- if .Values.rebuildStats }}
            - --rebuild-stats
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
